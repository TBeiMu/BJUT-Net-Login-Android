name: 发布正式 APK

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 已存在的版本标签，例如 v0.1.0
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: android-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: 检查版本和更新说明
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo '标签格式错误'; exit 1; }
          test -f "docs/releases/$RELEASE_TAG.md" || { echo '缺少中文更新说明'; exit 1; }
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: 'false'
      - name: 准备 Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: 测试与 Lint
        run: ./gradlew :app:testDebugUnitTest :app:testReleaseUnitTest :app:lintDebug :app:lintRelease --no-daemon --console=plain
      - name: 构建正式签名 APK
        env:
          GXZ_SIGNING_KEYSTORE_BASE64: ${{ secrets.GXZ_SIGNING_KEYSTORE_BASE64 }}
          GXZ_SIGNING_STORE_PASSWORD: ${{ secrets.GXZ_SIGNING_STORE_PASSWORD }}
          GXZ_SIGNING_KEY_ALIAS: ${{ secrets.GXZ_SIGNING_KEY_ALIAS }}
          GXZ_SIGNING_KEY_PASSWORD: ${{ secrets.GXZ_SIGNING_KEY_PASSWORD }}
          GXZ_SIGNING_KEYSTORE_PATH: ${{ runner.temp }}/gongxiaozhu-release.p12
        run: |
          set -euo pipefail
          umask 077
          test -n "$GXZ_SIGNING_KEYSTORE_BASE64" || { echo '缺少正式签名密钥'; exit 1; }
          test -n "$GXZ_SIGNING_STORE_PASSWORD" || { echo '缺少正式签名口令'; exit 1; }
          test -n "$GXZ_SIGNING_KEY_ALIAS" || { echo '缺少正式签名别名'; exit 1; }
          test -n "$GXZ_SIGNING_KEY_PASSWORD" || { echo '缺少正式签名密钥口令'; exit 1; }
          printf '%s' "$GXZ_SIGNING_KEYSTORE_BASE64" | base64 --decode > "$GXZ_SIGNING_KEYSTORE_PATH"
          ./gradlew :app:assembleRelease --no-daemon --console=plain
      - name: 核对版本、签名与校验值
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, shutil, subprocess
          metadata = json.loads(pathlib.Path('app/build/outputs/apk/release/output-metadata.json').read_text())
          element = metadata['elements'][0]
          if os.environ['RELEASE_TAG'] != 'v' + element['versionName']:
              raise SystemExit('版本标签与 APK versionName 不一致')
          if element['versionCode'] <= 0 or metadata['applicationId'] != 'io.github.tbeimu.gongxiaozhu':
              raise SystemExit('APK 版本或包名错误')
          source = pathlib.Path('app/build/outputs/apk/release') / element['outputFile']
          signer = pathlib.Path(os.environ['ANDROID_HOME']) / 'build-tools/36.0.0/apksigner'
          certificate = subprocess.check_output([str(signer), 'verify', '--print-certs', str(source)], text=True)
          prefix = 'Signer #1 certificate SHA-256 digest: '
          actual = next(line[len(prefix):].strip().lower() for line in certificate.splitlines() if line.startswith(prefix))
          expected = pathlib.Path('release-signing.sha256').read_text().strip().lower()
          if actual != expected:
              raise SystemExit('签名证书与固定发布证书不一致')
          assets = pathlib.Path(os.environ['RUNNER_TEMP']) / 'release-assets'
          assets.mkdir()
          apk = assets / 'gongxiaozhu.apk'
          shutil.copyfile(source, apk)
          digest = hashlib.sha256(apk.read_bytes()).hexdigest()
          (assets / 'SHA256SUMS.txt').write_text(digest + '  gongxiaozhu.apk\n', encoding='utf-8')
          PY
      - name: 保存正式 APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: gongxiaozhu-${{ env.RELEASE_TAG }}
          path: ${{ runner.temp }}/release-assets/
          retention-days: 14
      - name: 发布 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo '该版本已发布，拒绝覆盖历史 APK；请使用新版本号。'
            exit 1
          fi
          gh release create "$RELEASE_TAG" --verify-tag --latest --title "工小助 $RELEASE_TAG" \
            --notes-file "docs/releases/$RELEASE_TAG.md" \
            "$RUNNER_TEMP/release-assets/gongxiaozhu.apk" "$RUNNER_TEMP/release-assets/SHA256SUMS.txt"
      - name: 清理临时签名文件
        if: always()
        run: rm -f -- "$RUNNER_TEMP/gongxiaozhu-release.p12"
